<!doctype html>
<html lang="en">
<head>

<title>100+ Reasons to do SKY</title>

<style>
/* Layout: one flashcard at a time on a quiet page, with a slim top bar and a bottom pager.
   The card reproduces the deck's slide grid on wide screens and stacks into a single reading column on phones.
   One deliberate light look, matching the PDF (colours are set explicitly so the host theme never bleeds through). */
:root {
  --page: #EEF1F6;      /* page ground behind the card */
  --card: #FFFFFF;      /* the flashcard */
  --ink: #1D2B4A;       /* headlines, labels */
  --body: #2B3852;      /* running text */
  --muted: #6B7489;     /* captions, meta */
  --link: #3A6C8C;      /* citations and text links */
  --finding: #EEF1F6;   /* key-finding boxes */
  --panel: #F8F9FB;     /* about-the-study panel */
  --paper: #F5F6FA;
  --gold: #F2C14E;
  --sun: #FBDD6B;       /* cover yellow */
  --sky: #2F6FB8;       /* cover accent */
  --mind-M: #3470B8; --mind-D: #1F4E8C; --mind-T: #E6EFFA; --mind-L: #C7DBF3;
  --body-M: #3F8A57; --body-D: #2A6640; --body-T: #E7F3EA; --body-L: #C9E4D1;
  --society-M: #A84870; --society-D: #7E2F52; --society-T: #F7E8EE; --society-L: #EFCADA;
  --neutral-M: #1D2B4A; --neutral-D: #1D2B4A; --neutral-T: #EEF1F6; --neutral-L: #D3D9E4;
  --serif: "EB Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Lato", "Helvetica Neue", Arial, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--page); color: var(--body); }
body { margin: 0; font-family: var(--sans); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
a { color: var(--link); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; border-radius: 6px; }
img { max-width: 100%; }
.stage:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid #E1E6EF; }
.bar-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; text-decoration: none; color: var(--ink); }
.brand img { width: 38px; height: 38px; flex: none; }
.brand span { font-family: var(--serif); font-weight: 600; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar nav { display: flex; align-items: center; gap: 4px; }
.navlink { font: 700 0.82rem/1 var(--sans); color: var(--muted); text-decoration: none; padding: 10px 10px; border-radius: 8px; letter-spacing: .02em; }
.navlink:hover { color: var(--ink); background: var(--paper); }
.dl { display: inline-flex; align-items: center; gap: 8px; font: 700 0.85rem/1 var(--sans); color: #fff; background: var(--ink);
  text-decoration: none; padding: 10px 14px; border-radius: 999px; white-space: nowrap; }
.dl:hover { background: #2B3D66; }
.dl svg { width: 16px; height: 16px; flex: none; }
@media (max-width: 560px) {
  .brand span { font-size: 1rem; }
  .navlink.key { display: none; }
  .dl .long { display: none; }
}

/* ---------- stage ---------- */
.stage { max-width: 1180px; margin: 0 auto; padding-block: 20px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(29,43,74,.06), 0 8px 28px rgba(29,43,74,.08);
  padding: clamp(18px, 3.2vw, 40px); min-height: min(640px, calc(100vh - 180px)); display: flex; flex-direction: column; gap: 20px; }
.view.fade { animation: fade .28s ease-out; }
@keyframes fade { from { opacity: .35; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view.fade { animation: none; } }
.logo-sm { width: 52px; height: 52px; flex: none; }
h1, h2, h3 { color: var(--ink); text-wrap: balance; margin: 0; }
.title { font-family: var(--serif); font-weight: 600; font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.3rem); line-height: 1.12; text-align: center; }
.subtitle { font-family: var(--serif); font-size: clamp(1.05rem, 1rem + .3vw, 1.25rem); color: var(--muted); text-align: center; margin: 4px 0 0; }
.head-row { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 12px; }
.tag { display: inline-flex; align-items: center; font: 700 0.68rem/1 var(--sans); letter-spacing: .07em; text-transform: uppercase;
  padding: 7px 10px; border-radius: 999px; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- reason card ---------- */
.card-top { display: flex; align-items: flex-start; gap: 14px; }
.card-top .tags { flex: 1; min-width: 0; padding-top: 12px; }
.reason-no { text-align: right; flex: none; line-height: 1; padding-top: 4px; }
.reason-no small { display: block; font: 700 .66rem/1 var(--sans); letter-spacing: .22em; color: var(--muted); margin-bottom: 4px; }
.reason-no b { font: 900 clamp(1.9rem, 1.5rem + 1.3vw, 2.4rem)/1 var(--sans); }
.card-main { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: clamp(20px, 3vw, 44px); align-items: center; flex: 1; }
.card-text { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.headline { font-family: var(--serif); font-weight: 600; font-size: clamp(1.55rem, 1.2rem + 1.25vw, 2.1rem); line-height: 1.12; }
.participants { font-family: var(--serif); font-size: clamp(1.05rem, 1rem + .35vw, 1.25rem); color: var(--muted); margin: -6px 0 2px; }
.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.findings li { background: var(--finding); border-radius: 8px; padding: 10px 14px; font-size: clamp(1rem, .96rem + .2vw, 1.1rem); color: var(--body); line-height: 1.4; }
.findings .arrow { font-weight: 900; margin-right: 4px; }
.findings.two { grid-template-columns: 1fr 1fr; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.card-art { display: flex; justify-content: center; }
.card-art .art { width: 170px; height: 170px; }
.pop { display: flex; align-items: center; gap: 10px; font: 700 .95rem/1.2 var(--sans); color: var(--ink); }
.pop img { width: 32px; height: 32px; flex: none; }
.design { background: var(--finding); color: var(--muted); font-size: .64rem; white-space: normal; text-align: left; line-height: 1.3; justify-self: start; max-width: 100%; }
.about { background: var(--panel); border-radius: 10px; padding: 14px 18px; display: grid;
  grid-template-columns: 1.15fr .7fr 1.2fr 1.45fr; gap: 10px 22px; margin: 0; }
.about div { min-width: 0; }
.about dt { font: 700 .66rem/1 var(--sans); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
.about dd { margin: 0; font-size: .9rem; line-height: 1.4; color: var(--body); overflow-wrap: anywhere; }
.about dd b { color: var(--ink); }
.card-foot { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
.source { font-size: .95rem; }
.source small { font: 700 .66rem/1 var(--sans); letter-spacing: .2em; color: var(--muted); margin-right: 10px; }
.source a { font-style: italic; }
.foot-links { font-size: .85rem; color: var(--muted); }
.foot-links a { color: var(--muted); font-weight: 700; }

@media (max-width: 860px) {
  .card-main { grid-template-columns: minmax(0, 1fr) 92px; gap: 12px 14px; align-items: start;
    grid-template-areas: "meta art" "head head" "part part" "find find"; }
  .card-text { display: contents; }
  .card-meta { grid-area: meta; flex-direction: column; align-items: flex-start; gap: 8px; align-self: center; }
  .card-art { grid-area: art; justify-content: flex-end; }
  .card-art .art { width: 92px; height: 92px; }
  .headline { grid-area: head; margin-top: 4px; }
  .participants { grid-area: part; margin: -8px 0 0; }
  .findings { grid-area: find; }
  .about { grid-template-columns: 1fr 1fr; }
  .findings.two { grid-template-columns: 1fr; }
}
@media (max-width: 420px) {
  .about { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .head-row { grid-template-columns: 1fr; }
  .head-row > .logo-sm, .head-row > span:last-child, .card-top > .logo-sm { display: none; }
  .tags .tag { white-space: normal; text-align: left; line-height: 1.25; }
}

/* ---------- cover ---------- */
.view.cover { background: var(--sun); display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); align-items: center; gap: 24px; }
.cover-text { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; min-width: 0; }
.cover .logo-lg { width: 86px; height: 86px; }
.cover .pill { background: var(--sky); color: #fff; font-size: .78rem; letter-spacing: .18em; padding: 9px 16px; }
.cover h1 { font-family: var(--serif); line-height: 1; }
.cover h1 .big { display: block; font-weight: 800; font-size: clamp(3rem, 2rem + 4.5vw, 5rem); letter-spacing: -.01em; }
.cover h1 .line2 { display: block; font-weight: 600; font-size: clamp(1.6rem, 1.2rem + 1.8vw, 2.5rem); line-height: 1.12; margin-top: 10px; }
.cover h1 .sky { color: var(--sky); }
.cover p { margin: 0; font-size: clamp(1.05rem, 1rem + .3vw, 1.2rem); color: #4A4F5C; max-width: 34em; }
.cover .chips { display: flex; gap: 10px; flex-wrap: wrap; }
.cover .chips span { background: #fff; font-size: .78rem; letter-spacing: .16em; padding: 9px 16px; }
.cover .org { font-size: .85rem; color: #4A4F5C; }
.mosaic { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; max-width: 420px; justify-self: center; width: 100%; }
.mosaic img { grid-column: span 2; width: 100%; aspect-ratio: 1; max-width: 100%; }
.mosaic img:nth-child(1) { grid-column: 2 / span 2; } .mosaic img:nth-child(2) { grid-column: 4 / span 2; }
.mosaic img:nth-child(6) { grid-column: 2 / span 2; } .mosaic img:nth-child(7) { grid-column: 4 / span 2; }
.cover .start { display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; text-decoration: none;
  font: 700 1rem/1 var(--sans); padding: 14px 22px; border-radius: 999px; }
@media (max-width: 760px) {
  .view.cover { grid-template-columns: 1fr; }
  .mosaic { order: -1; max-width: 300px; }
  .cover .logo-lg { width: 64px; height: 64px; }
}

/* ---------- key ---------- */
.key-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.key-rows { display: grid; gap: 18px; margin: 0; }
.key-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: start; }
.key-row dt { display: flex; align-items: center; min-height: 34px; }
.key-row dd { margin: 0; }
.key-row h3 { font: 700 1rem/1.3 var(--sans); }
.key-row p { margin: 2px 0 0; font-size: .95rem; }
.ex-num { font: 900 1.7rem/1 var(--sans); color: var(--mind-M); }
.ex-aa { font: 600 1.9rem/1 var(--serif); color: var(--ink); }
.ex-box { background: var(--finding); border-radius: 6px; padding: 7px 12px; width: 120px; font-weight: 900; }
.ex-label { background: var(--paper); border-radius: 6px; padding: 9px 12px; width: 120px; font: 700 .62rem/1 var(--sans); letter-spacing: .12em; color: var(--muted); }
.ex-cite { font-style: italic; color: var(--link); font-size: .95rem; }
.who { background: var(--paper); border-radius: 12px; padding: 18px 20px; display: grid; gap: 12px; }
.who h3 { font: 900 .78rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; }
.who .note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: .9rem; color: var(--muted); margin-top: 4px; }
@media (max-width: 860px) { .key-grid { grid-template-columns: 1fr; } }
@media (max-width: 480px) { .key-row { grid-template-columns: 1fr; gap: 6px; } .key-row dt { min-height: 0; } }

/* ---------- index ---------- */
.index-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.index-tabs a { font: 700 .8rem/1 var(--sans); text-decoration: none; padding: 9px 14px; border-radius: 999px; color: var(--muted); background: var(--paper); }
.index-tabs a[aria-current="page"] { color: #fff; background: var(--ink); }
.dom-label { font: 900 .78rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; margin: 4px 0 -4px; }
.groups { display: grid; gap: 14px; }
.group { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 8px 16px; align-items: start; }
.group-label { display: flex; align-items: center; gap: 10px; font: 700 1rem/1.25 var(--sans); color: var(--ink); padding-top: 6px; }
.group-label img { width: 30px; height: 30px; flex: none; }
.group-label small { font-weight: 400; color: var(--muted); margin-left: 4px; }
.chips-n { display: flex; flex-wrap: wrap; gap: 6px; }
.chips-n a { min-width: 44px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px;
  font: 700 .95rem/1 var(--sans); text-decoration: none; font-variant-numeric: tabular-nums; padding: 0 8px; }
.chips-n a:hover { filter: brightness(.95); outline: 2px solid currentColor; outline-offset: -2px; }
.index-art { width: 180px; height: 180px; align-self: center; margin-top: 10px; }
@media (max-width: 640px) { .group { grid-template-columns: 1fr; } .group-label { padding-top: 0; } }

/* ---------- study design guide ---------- */
.section-head { font: 400 1.05rem/1.3 var(--sans); color: var(--mind-D); }
.section-head b { font-weight: 900; }
.guide-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.g-item { border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.g-kicker { font: 700 .62rem/1.3 var(--sans); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.g-item h3 { font: 700 1.05rem/1.25 var(--sans); color: var(--mind-D); }
.g-item p { margin: 0; font-size: .95rem; }
@media (max-width: 900px) { .guide-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .guide-grid { grid-template-columns: 1fr; } }

/* ---------- explore ---------- */
.explore { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 32px; align-items: center; }
.explore-text { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; min-width: 0; }
.explore h2 { font: 600 clamp(1.8rem, 1.3rem + 2vw, 2.6rem)/1.1 var(--serif); }
.explore p { margin: 0; font-size: 1.1rem; max-width: 34em; }
.cta { display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; text-decoration: none; font: 700 1.05rem/1 var(--sans); padding: 15px 24px; border-radius: 999px; }
.site { font: 700 1.2rem/1.2 var(--sans); }
.contact { font-size: .95rem; color: var(--muted); }
.shot { width: 100%; max-width: 320px; justify-self: center; border-radius: 14px; box-shadow: 0 10px 30px rgba(29,43,74,.18); }
.mini-links { font-size: .9rem; color: var(--muted); }
.mini-links a { color: var(--muted); font-weight: 700; }
@media (max-width: 760px) { .explore { grid-template-columns: 1fr; } .shot { max-width: 260px; } }

/* ---------- pager ---------- */
.pager { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid #E1E6EF;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.pager-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pager button { display: inline-flex; align-items: center; gap: 8px; font: 700 .95rem/1 var(--sans); color: var(--ink); background: var(--paper);
  border: 0; border-radius: 999px; padding: 12px 18px; cursor: pointer; min-height: 44px; }
.pager button:hover:not(:disabled) { background: #E3E8F1; }
.pager button:disabled { opacity: .35; cursor: default; }
.pager svg { width: 18px; height: 18px; }
.where { font: 700 .85rem/1.2 var(--sans); color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.where label { display: block; font-weight: 400; font-size: .75rem; }
.jump { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; }
.jump input { width: 92px; font: 700 .9rem/1 var(--sans); color: var(--ink); border: 1px solid #CBD3E1; border-radius: 8px; padding: 6px 8px; text-align: center; background: #fff; }
@media (max-width: 420px) { .pager button .lbl { display: none; } .pager button { padding: 12px 14px; } }
</style>

function tag(text, d) { return `<span class="tag" style="background:${v(d,'T')};color:${v(d,'D')}">${esc(text)}</span>`; }
function logo(cls) { return `<img class="${cls}" src="${IMG.logo}" alt="SSIAR logo" width="52" height="52">`; }
function pageHead(title, sub) {
  return `<div class="head-row">${logo('logo-sm')}<div><h1 class="title">${esc(title)}</h1>${sub ? `<p class="subtitle">${esc(sub)}</p>` : ''}</div><span></span></div>`;
}

function renderCover() {
  const order = ['calmhead', 'heart', 'lungs', 'community', 'sleep', 'sunsmile', 'genes'];
  return `<section class="view cover" aria-label="Cover">
    <div class="cover-text">
      <img class="logo-lg" src="${IMG.logo}" alt="SSIAR logo" width="86" height="86">
      <span class="tag pill">Interactive flashcards</span>
      <h1><span class="big">100+ Reasons</span><span class="line2">to do Sudarshan Kriya Yoga <span class="sky">(SKY)</span></span></h1>
      <p>${N} research highlights on the effects of SKY on mental, physical and social health, across diverse populations, places and contexts</p>
      <div class="chips">${['mind','body','society'].map(d => `<span class="tag" style="color:${v(d,'D')}">${DATA.dom[d].short}</span>`).join('')}</div>
      <a class="start" href="#key">Start reading <span aria-hidden="true">→</span></a>
      <span class="org">Sri Sri Institute for Advanced Research · The Art of Living Research Wing</span>
    </div>
    <div class="mosaic" aria-hidden="true">${order.map(a => `<img src="${IMG['cover_' + a]}" alt="">`).join('')}</div>
  </section>`;
}

function renderKey() {
  const rows = [
    [`<span class="ex-num">12</span>`, 'Reason number', `Each card is one reason, numbered 1 to ${N}.`],
    [`<span class="tags">${['mind','body','society'].map(d => tag(DATA.dom[d].short, d)).join('')}</span>`, 'Topic tags', 'Blue for mental health, green for physical health, pink for social health.'],
    [`<span class="ex-aa">Aa</span>`, 'Headline and participants', 'The research highlight, then who took part and how many (n).'],
    [`<span class="ex-box"><span style="color:var(--body-M)">↑</span> <span style="color:var(--mind-M)">↓</span></span>`, 'Key findings', 'As reported in the study: ↑ an increase, ↓ a decrease.'],
    [`<span class="ex-label">JOURNAL</span>`, 'About the study', 'Intervention, duration and journal. Affiliation is the corresponding author’s institutional affiliation.'],
    [`<span class="ex-cite">Author, Year</span>`, 'Source', 'Tap the citation to open the published paper.'],
  ];
  return `<section class="view" aria-label="How to read each card">
    ${pageHead('How to read each card', 'Every card is one published study, summarised without changes')}
    <div class="key-grid">
      <dl class="key-rows">${rows.map(([ex, h, p]) => `<div class="key-row"><dt>${ex}</dt><dd><h3>${h}</h3><p>${p}</p></dd></div>`).join('')}</dl>
      <aside class="who">
        <h3>Who took part</h3>
        ${DATA.pops_key.map(p => `<div class="pop"><img src="${IMG['pop_' + popIcon(p)]}" alt="">${esc(p)}</div>`).join('')}
        <div class="note"><span class="tag design">Study design</span><span>explained in the <a href="#guide-1"><b>Study design guide</b></a></span></div>
      </aside>
    </div>
  </section>`;
}
const POP_ICONS = {};
DATA.cards.forEach(c => c.pops.forEach(p => POP_ICONS[p.name] = p.icon));
const popIcon = name => POP_ICONS[name] || 'others';

const INDEX_META = {
  mind: ['Reasons to do SKY for a healthier mind', 'Mind · Mental health'],
  body: ['Reasons to do SKY for a healthier body', 'Body · Physical health'],
  society: ['Reasons to do SKY for a healthier society', 'Society · Social health'],
  people: ['Reasons to do SKY across people and walks of life', null],
};
function renderIndex(which) {
  const [title, label] = INDEX_META[which];
  const groups = DATA.index[which];
  const tabs = [['mind','Mind'],['body','Body'],['society','Society'],['people','People']]
    .map(([k, t]) => `<a href="#${k}"${k === which ? ' aria-current="page"' : ''}>${t}</a>`).join('');
  const body = groups.map(g => {
    const d = g.dom;
    const chips = g.nums.map(n => {
      const strong = DATA.star[n];
      return `<a href="#reason-${n}" aria-label="Reason ${n}" style="background:${v(d, strong ? 'L' : 'T')};color:${v(d,'D')}">${n}</a>`;
    }).join('');
    const icon = g.icon ? `<img src="${IMG['pop_' + g.icon]}" alt="">` : '';
    return `<div class="group"><div class="group-label">${icon}<span>${esc(g.label)}<small>${g.nums.length}</small></span></div><div class="chips-n">${chips}</div></div>`;
  }).join('');
  const dcol = which === 'people' ? 'neutral' : which;
  return `<section class="view" aria-label="${esc(title)}">
    ${pageHead(title, 'Tap a number to open the card for details.')}
    <nav class="index-tabs" aria-label="Index sections">${tabs}</nav>
    ${label ? `<p class="dom-label" style="color:${v(dcol,'M')}">${label}</p>` : ''}
    <div class="groups">${body}</div>
    ${which === 'society' ? `<img class="index-art" src="${IMG.cover_community}" alt="">` : ''}
  </section>`;
}

function renderCard(c) {
  const d = c.dom;
  const part = [c.ptype, c.size ? 'n = ' + c.size : ''].filter(Boolean).join(' · ');
  const findings = c.findings.map(f => {
    const a = f[0] === '↑' || f[0] === '↓';
    return `<li>${a ? `<span class="arrow" style="color:${v(d,'M')}">${f[0]}</span>${esc(f.slice(1).trimStart())}` : esc(f)}</li>`;
  }).join('');
  const two = c.findings.length >= 5 && c.findings.join('').length > 230;
  const dur = [c.duration, c.followup ? 'Follow-up: ' + c.followup : ''].filter(Boolean);
  const about = [
    c.intervention && ['Intervention', esc(c.intervention)],
    dur.length && ['Duration', dur.map(esc).join('<br>')],
    c.journal && ['Journal', esc(c.journal)],
    c.affiliation.length && ['Affiliation', c.affiliation.map(([t, b]) => b ? `<b>${esc(t)}</b>` : esc(t)).join('')],
  ].filter(Boolean);
  return `<article class="view" aria-label="Reason ${c.n}">
    <div class="card-top">${logo('logo-sm')}
      <div class="tags">${c.tags.map(t => tag(t.t, t.d)).join('')}</div>
      <div class="reason-no"><small>REASON</small><b style="color:${v(d,'M')}">${c.n}</b></div>
    </div>
    <div class="card-main">
      <div class="card-text">
        <h2 class="headline">${esc(c.headline)}</h2>
        ${part ? `<p class="participants">${esc(part)}</p>` : ''}
        <div class="card-meta">
          ${c.pops.map(p => `<div class="pop"><img src="${IMG['pop_' + p.icon]}" alt="">${esc(p.name)}</div>`).join('')}
          ${c.design ? `<span class="tag design">${esc(c.design)}</span>` : ''}
        </div>
        <ul class="findings${two ? ' two' : ''}">${findings}</ul>
      </div>
      <div class="card-art"><img class="art" src="${IMG[c.art]}" alt="" width="170" height="170"></div>
    </div>
    <dl class="about">${about.map(([k, val]) => `<div><dt>${k}</dt><dd>${val}</dd></div>`).join('')}</dl>
    <div class="card-foot">
      <span class="source"><small>SOURCE</small><a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.citation)}</a></span>
      <span class="foot-links"><a href="#key">Key</a> &nbsp;·&nbsp; <a href="#${DOM_INDEX[d]}">All reasons</a> &nbsp;·&nbsp; 100+ Reasons to do SKY</span>
    </div>
  </article>`;
}

const TINT = { 'II.': '#EEF3FA', 'III.': '#F3EFF7', 'IV.': '#EEF6F1' };
function gName(runs) { return runs.map(([t, it]) => it ? `<i>${esc(t)}</i>` : esc(t)).join(runs.length > 1 && !runs[1][0].startsWith(' ') ? ' ' : ''); }
function renderGuide(page) {
  let items;
  if (page === 1) {
    items = DATA.guide.experimental.map(g => `<div class="g-item" style="background:#F5F7FB"><h3>${gName(g.name)}</h3><p>${esc(g.desc)}</p></div>`).join('');
  } else {
    items = DATA.guide.other.flatMap(s => s.items.map(g =>
      `<div class="g-item" style="background:${TINT[s.head[0].trim()]}"><span class="g-kicker">${esc(s.head.join(''))}</span><h3>${gName(g.name)}</h3><p>${esc(g.desc)}</p></div>`)).join('');
  }
  const next = page === 1 ? `<a href="#guide-2">More study designs →</a>` : `<a href="#explore">Explore the evidence →</a>`;
  return `<section class="view" aria-label="Study design guide, page ${page}">
    ${pageHead('Study design guide', page === 1 ? 'What the study design tag on each card means' : 'Evidence reviews, lab-based, qualitative and observational designs')}
    ${page === 1 ? `<p class="section-head">I. <b>Experimental</b> study designs</p>` : ''}
    <div class="guide-grid">${items}</div>
    <p class="mini-links" style="text-align:right;margin:0"><a href="#mind">All reasons</a> &nbsp;·&nbsp; ${next}</p>
  </section>`;
}

function renderExplore() {
  const chips = [['Topic','mind'],['Population','body'],['Intervention','society'],['Duration','mind'],['Location','body']];
  return `<section class="view" aria-label="Explore the evidence, your way">
    <div class="card-top">${logo('logo-sm')}</div>
    <div class="explore">
      <div class="explore-text">
        <h2>Explore the evidence, your way</h2>
        <p>Each reason links to its published paper. To see every study together, visit the Evidence Finder on our research website: accessible research summaries you can browse, filter and explore by:</p>
        <div class="tags">${chips.map(([t, d]) => tag(t, d)).join('')}</div>
        <a class="cta" href="https://research.artofliving.org" target="_blank" rel="noopener">Open the Evidence Finder <span aria-hidden="true">→</span></a>
        <a class="site" href="https://research.artofliving.org" target="_blank" rel="noopener">research.artofliving.org</a>
        <span class="contact">Questions: <a href="mailto:researchstudies@ssiar.org"><b>researchstudies@ssiar.org</b></a></span>
        <span class="mini-links"><a href="#cover">Back to the start</a> &nbsp;·&nbsp; <a href="#mind">All reasons</a></span>
      </div>
      <a href="https://research.artofliving.org" target="_blank" rel="noopener" aria-label="Open the Evidence Finder"><img class="shot" src="${IMG.finder}" alt="Evidence Finder dashboard on the Art of Living Research website"></a>
    </div>
  </section>`;
}

function render(id) {
  if (id === 'cover') return renderCover();
  if (id === 'key') return renderKey();
  if (INDEX_META[id]) return renderIndex(id);
  if (id === 'guide-1') return renderGuide(1);
  if (id === 'guide-2') return renderGuide(2);
  if (id === 'explore') return renderExplore();
  const n = +id.split('-')[1];
  return renderCard(DATA.cards.find(c => c.n === n));
}

const stage = document.getElementById('stage');
const whereEl = document.getElementById('where');
const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
let current = 0;

function show(id, opts = {}) {
  let i = VIEWS.indexOf(id);
  if (i < 0) i = 0;
  current = i;
  stage.innerHTML = render(VIEWS[i]);
  const view = stage.firstElementChild;
  if (!opts.initial) view.classList.add('fade');
  const vid = VIEWS[i];
  whereEl.textContent = vid.startsWith('reason-') ? `Reason ${vid.slice(7)} of ${N}` : `${i + 1} / ${VIEWS.length}`;
  prevBtn.disabled = i === 0; nextBtn.disabled = i === VIEWS.length - 1;
  document.title = vid.startsWith('reason-') ? `Reason ${vid.slice(7)} · 100+ Reasons to do SKY` : '100+ Reasons to do SKY';
  if (!opts.initial) { window.scrollTo({ top: 0 }); stage.focus({ preventScroll: true }); }
}
// The address never changes: in-page links just switch the view.
// The browser's Back button still steps back through the cards viewed in this visit.
function go(id) {
  if (VIEWS[current] === id) return;
  show(id);
  try { history.pushState({ view: id }, '', location.pathname + location.search); } catch (e) {}
}
window.__go = go;
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  go(a.getAttribute('href').slice(1));
});
window.addEventListener('popstate', e => show((e.state && e.state.view) || 'cover'));
prevBtn.addEventListener('click', () => current > 0 && go(VIEWS[current - 1]));
nextBtn.addEventListener('click', () => current < VIEWS.length - 1 && go(VIEWS[current + 1]));
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') nextBtn.click();
  if (e.key === 'ArrowLeft') prevBtn.click();
});
document.getElementById('jump').addEventListener('submit', e => {
  e.preventDefault();
  const inp = document.getElementById('jump-n');
  const n = parseInt(inp.value, 10);
  if (n >= 1 && n <= N) { go('reason-' + n); inp.value = ''; inp.blur(); }
  else { inp.value = ''; inp.placeholder = `1–${N}`; }
});
// Swipe left/right on touch screens; vertical scrolling is left alone.
let tx = null, ty = null;
stage.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
stage.addEventListener('touchend', e => {
  if (tx === null) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty; tx = ty = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) (dx < 0 ? nextBtn : prevBtn).click();
}, { passive: true });

document.getElementById('bar-logo').src = IMG.logo;
try { history.replaceState({ view: 'cover' }, '', location.pathname + location.search); } catch (e) {}
show('cover', { initial: true });
</script>
</body>
</html>
